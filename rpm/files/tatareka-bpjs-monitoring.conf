# Dashboard Klaim BPJS (rpm tatareka-bpjs-monitoring), Apache only and optional: the screen script is loaded through a
# SIMGOS properti_config hook with SIMGOS's own ?_dc stamp, which only changes on SIMGOS updates. Make browsers
# revalidate it (a 304 when unchanged) so package updates show at once.
<Location "/apps/SIMpel/packages/classic/BpjsMonitoring.js">
    Header set Cache-Control "no-cache"
</Location>
