; tatareka-bpjs-monitoring. Setiap malam pukul 01.00 menjaga status klaim BPJS di SIMGOS tetap mutakhir: bila ada
; komputer petugas yang memanggil BPJS melalui SIMGOS dalam 24 jam terakhir (sehingga tidak pernah berjalan di salinan
; server ini), paket ini menanyakan ke Status Klaim dari BPJS milik SIMGOS tanggal pulang dalam 180 hari terakhir yang
; masih memiliki klaim final yang belum disetujui: setiap tanggal pada malam pertama, lalu seminggu sekali pada hari
; yang sama dengan hari pulangnya (giliran yang terlewat diambil pada malam berikutnya). 3 panggilan BPJS per tanggal
; dan jenis pelayanan, berjarak 1 detik. Panggilan dilakukan oleh SIMGOS dengan akses rumah sakit, sama seperti ketika
; petugas membuka layarnya.
;   Lihat yang akan ditanyakan:  tatareka-bpjs-monitoring plan
;   Status dan hasil terakhir:   tatareka-bpjs-monitoring status
[monitoring]
; on | off
refresh = on
